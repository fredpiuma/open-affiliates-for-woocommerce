<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320" role="img" aria-label="Affiliate network illustration">
  <title>Affiliate network</title>
  <!-- Open Affiliates dashboard illustration - GPL-2.0-or-later -->
  <circle cx="160" cy="160" r="140" fill="#e6f1f8"/>
  <g stroke="#2a81ae" stroke-width="4" stroke-linecap="round">
    <line x1="160" y1="120" x2="95" y2="195"/>
    <line x1="160" y1="120" x2="225" y2="195"/>
    <line x1="95" y1="195" x2="60" y2="255"/>
    <line x1="95" y1="195" x2="130" y2="255"/>
    <line x1="225" y1="195" x2="190" y2="255"/>
    <line x1="225" y1="195" x2="260" y2="255"/>
  </g>
  <g fill="#fff" stroke="#2a81ae" stroke-width="4">
    <circle cx="95" cy="195" r="20"/><circle cx="225" cy="195" r="20"/>
    <circle cx="60" cy="255" r="14"/><circle cx="130" cy="255" r="14"/>
    <circle cx="190" cy="255" r="14"/><circle cx="260" cy="255" r="14"/>
  </g>
  <circle cx="160" cy="100" r="36" fill="#f25a68"/>
  <text x="160" y="113" text-anchor="middle" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#fff">$</text>
  <g fill="#2a81ae" font-family="Open Sans, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <text x="95" y="201">$</text><text x="225" y="201">$</text>
  </g>
</svg>
